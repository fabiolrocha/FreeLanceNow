name: Tarefa da equipe
description: Entrega com dependências e critérios de aceite, sem papéis fixos
title: '[ID] — '
body:
  - type: textarea
    id: resultado
    attributes:
      label: Resultado esperado
      description: Referencie docs/backlog.md e descreva o comportamento. Combine contribuições e revisão conforme disponibilidade.
    validations:
      required: true
  - type: textarea
    id: aceite
    attributes:
      label: Critérios de aceite e validação
      placeholder: Cenários e comandos que demonstram a conclusão.
    validations:
      required: true
  - type: input
    id: dependencias
    attributes:
      label: Dependências e prazo
      placeholder: Cards necessários e data prevista
