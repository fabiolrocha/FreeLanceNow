spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      data-source-properties:
        sslmode: verify-full
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  cors-origins: ${CORS_ORIGINS}
  seed-demo: false
