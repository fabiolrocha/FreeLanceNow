spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Small pool: Render's free instance has 512 MB and Neon's free compute limits connections.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      # Neon suspends idle compute; the first connection after a pause can take a few seconds.
      connection-timeout: 30000
      data-source-properties:
        sslmode: verify-full
        # Validate Neon's certificate against the JVM trust store instead of ~/.postgresql/root.crt,
        # which does not exist in the container.
        sslfactory: org.postgresql.ssl.DefaultJavaSSLFactory
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

logging:
  structured:
    # One JSON object per line (Elastic Common Schema), including the requestId from the MDC.
    format:
      console: ecs

server:
  # Render terminates TLS and forwards X-Forwarded-* headers.
  forward-headers-strategy: framework

app:
  cors-origins: ${CORS_ORIGINS}
  # Links in e-mails must point to the published frontend; no localhost fallback in production.
  web-base-url: ${PUBLIC_APP_URL}
  # Demo accounts for presentations. Off by default; when on, the password must come from the
  # SEED_DEMO_PASSWORD secret, never from the repository (see docs/deploy.md).
  seed-demo: ${SEED_DEMO:false}
  seed-demo-password: ${SEED_DEMO_PASSWORD:}
  rate-limit:
    # POSTs per minute and client address on /api/v1/auth/** (login, cadastro, links de e-mail).
    auth-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:20}
  resend:
    # Without a verified domain, Resend only delivers from onboarding@resend.dev to the account owner.
    from-email: ${RESEND_FROM_EMAIL:FreeLanceNow <onboarding@resend.dev>}
