spring:
  application:
    name: freelancenow-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/freelancenow}
    username: ${DB_USERNAME:freelancenow}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: freelancenow-api
    ttl-seconds: 900
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
  seed-demo: ${SEED_DEMO:false}
  contracts:
    deadline-check-ms: ${CONTRACT_DEADLINE_CHECK_MS:60000}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    platform-fee-percent: ${PLATFORM_FEE_PERCENT:10}
  resend:
    api-key: ${RESEND_API_KEY:}
    from-email: ${RESEND_FROM_EMAIL:no-reply@freelancenow.test}
  admin-bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    name: ${ADMIN_BOOTSTRAP_NAME:Administrador}
