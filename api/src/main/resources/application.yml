spring:
  application:
    name: freelancenow-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/freelancenow}
    username: ${DB_USERNAME:freelancenow}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Lazy associations (freelancer, category, client...) load in one IN query per batch
        # instead of one query per row. Without it, a page of 50 listings ran up to 100 queries.
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 26MB
server:
  port: ${PORT:8081}
  tomcat:
    max-swallow-size: 30MB
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      # /actuator/health/liveness answers without touching the database. Render's health check
      # uses it so that its periodic checks do not keep Neon's compute awake.
      probes:
        enabled: true
app:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  jwt:
    secret: ${JWT_SECRET}
    issuer: freelancenow-api
    ttl-seconds: 900
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:2592000}
    reset-ttl-seconds: 1800
  web-base-url: ${PUBLIC_APP_URL:http://localhost:5173}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
  seed-demo: ${SEED_DEMO:false}
  # Senha das contas de demonstração; o perfil prod não tem valor padrão.
  seed-demo-password: ${SEED_DEMO_PASSWORD:Demo12345}
  rate-limit:
    # 0 desliga; o perfil prod liga com 20 por minuto.
    auth-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:0}
  contracts:
    deadline-check-ms: ${CONTRACT_DEADLINE_CHECK_MS:60000}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    connect-webhook-secret: ${STRIPE_CONNECT_WEBHOOK_SECRET:}
    # Rotina que tenta repasses pendentes e atualiza contas de recebimento ainda não prontas.
    transfer-check-ms: ${STRIPE_TRANSFER_CHECK_MS:300000}
    platform-fee-percent: ${PLATFORM_FEE_PERCENT:10}
    # Formas oferecidas no Checkout. Pix e boleto exigem conta Stripe brasileira com o método ativo.
    methods: ${STRIPE_PAYMENT_METHODS:CARD,PIX,BOLETO}
    public-base-url: ${PUBLIC_APP_URL:}
  resend:
    api-key: ${RESEND_API_KEY:}
    from-email: ${RESEND_FROM_EMAIL:no-reply@freelancenow.test}
  admin-bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    name: ${ADMIN_BOOTSTRAP_NAME:Administrador}
logging:
  pattern:
    # Show the request id (RequestLogFilter) on every line in development.
    level: "%5p [%X{requestId:-}]"
