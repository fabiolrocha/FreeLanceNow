server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Fotos dos anúncios: até 5 arquivos de 5 MB por envio (RN08).
  client_max_body_size 26m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Mesmos cabeçalhos do web/vercel.json, para o ambiente local se comportar como o publicado.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location / { try_files $uri $uri/ /index.html; }
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
  }
  # Arquivos com hash no nome podem ficar em cache por um ano.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }
  location /api/ {
    proxy_pass http://api:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /actuator/ { proxy_pass http://api:8081; }
}
